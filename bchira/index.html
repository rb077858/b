<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>שותפים לחדר</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&display=swap">
<style>
/* Layout concept: a room sheet for six bunks. Tabs for friends / me / results, with a bunk strip pinned under the results that fills as you pick. */
:root{
  --bg:#E8EDF1;
  --surface:#F7F9FB;
  --ink:#16222D;
  --muted:#586979;
  --line:#C6D1DB;
  --accent:#1D5C8E;
  --accent-ink:#FFFFFF;
  --accent-soft:#D5E5F2;
  --good:#2A7A4B;
  --warn:#A8721A;
  --bad:#B03A2E;
  --font-display:'Secular One','Heebo',system-ui,sans-serif;
  --font-body:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1820;--surface:#17232D;--ink:#E5ECF1;--muted:#93A4B2;--line:#2B3B48;
    --accent:#6AB0E4;--accent-ink:#0B1A25;--accent-soft:#1D3546;
    --good:#6CC592;--warn:#E2B35C;--bad:#EA8A7E;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1820;--surface:#17232D;--ink:#E5ECF1;--muted:#93A4B2;--line:#2B3B48;
  --accent:#6AB0E4;--accent-ink:#0B1A25;--accent-soft:#1D3546;
  --good:#6CC592;--warn:#E2B35C;--bad:#EA8A7E;color-scheme:dark;
}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 var(--font-body);
  padding-block:22px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:640px;margin:0 auto}
h1{font:400 32px/1.1 var(--font-display);margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--muted);max-width:52ch}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:18px}
.tab{background:none;border:0;border-inline-start:1px solid var(--line);padding:11px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.tab:first-child{border-inline-start:0}
.tab b{font-weight:700}
.tab small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 4px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.addf{display:flex;gap:8px;margin-bottom:14px}
.addf input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}
.link.danger{color:var(--bad)}

.friend{display:flex;align-items:center;gap:12px}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:400 19px var(--font-display)}
.fmain{flex:1;min-width:0}
.fname{font-weight:700;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-inline-start:6px;font-weight:400}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.facts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;justify-content:center}

.dots{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 14px}
.dot{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.dot.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qtext{font:400 23px/1.25 var(--font-display);margin:2px 0 6px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:start;min-height:48px;padding:9px 12px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;line-height:1.3}
.opt .r{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .r{border-color:var(--accent);background:radial-gradient(var(--accent) 0 42%,transparent 48%)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.qcard{padding:14px}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.star{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:13px;color:var(--muted);cursor:pointer;flex:none}
.star[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);font-weight:700}
.qs{font-weight:700;margin:0 0 2px}

.row{display:flex;flex-direction:column;gap:8px}
.rtop{display:flex;align-items:center;gap:12px}
.rank{flex:none;width:26px;text-align:center;font:400 20px var(--font-display);color:var(--muted)}
.pct{font:400 26px/1 var(--font-display);flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;border:1px solid currentColor}
.b4,.b3{color:var(--good)}.b2{color:var(--warn)}.b1{color:var(--bad)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor}
.acts{display:flex;gap:8px;align-items:center}
.btn.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pick[aria-disabled="true"]{opacity:.5}
.det{display:grid;grid-template-columns:5.6em 1fr 1fr 14px;gap:6px 10px;font-size:13px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.det .h{color:var(--muted);font-size:12px}
.det span{min-width:0;overflow-wrap:anywhere}
.d{width:10px;height:10px;border-radius:50%;margin-top:5px}
.d.g{background:var(--good)}.d.w{background:var(--warn)}.d.x{background:var(--bad)}

.tray{position:sticky;bottom:0;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 16px rgba(10,20,30,.12)}
.beds{display:flex;gap:8px;justify-content:center}
.bed{position:relative;flex:none;width:44px;height:52px;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:end center;padding-bottom:7px;font:400 17px/1 var(--font-display);color:var(--muted)}
.bed::before{content:"";position:absolute;top:6px;inset-inline:7px;height:10px;border-radius:3px;background:currentColor;opacity:.28}
.bed.f{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bed.me{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--bg);font-size:13px}
.ttxt{text-align:center;font-size:14px;margin:10px 0 0}
.ttxt .sub{display:block;color:var(--muted);font-size:13px}
.msg{color:var(--warn);font-weight:700}
.copyrow{display:flex;justify-content:center;margin-top:10px}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tool .btn[aria-expanded="true"]{background:var(--accent-soft)}
.panel{margin-top:10px}
.panel .qs{margin-bottom:4px}
.sm{font-size:13px}
.msg-ok{color:var(--good);font-weight:700}.msg-err{color:var(--bad);font-weight:700}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;border-color:var(--warn)}
.ctext.ed{resize:vertical}
.ctext{display:block;width:100%;margin-top:10px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:none}
.sec{margin:20px 0 8px;font-size:13px;color:var(--muted);letter-spacing:.04em}
@media (prefers-reduced-motion:no-preference){.bar i,.prog i{transition:width .25s ease}}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="he" id="app"></div>
<script>
(function(){
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');
var KEY='reembir.bchira.v1', MAXP=5;
var QS=[
 {id:'sleep',s:'שעת שינה',t:'באיזו שעה אתה בדרך כלל הולך לישון?',o:['לפני 23:00','23:00 עד 00:30','00:30 עד 02:00','אחרי 02:00']},
 {id:'wake',s:'בוקר',t:'איך נראה הבוקר שלך?',o:['קם מיד עם השעון','קם אחרי נודניק או שניים','צריך שיעירו אותי','קם ברגע האחרון']},
 {id:'tidy',s:'סדר',t:'כמה מסודר אתה בחדר?',o:['הכל במקומו תמיד','בדרך כלל מסודר','קצת בלגן','בלגן יצירתי']},
 {id:'noise',s:'רעש',t:'כמה רעש אתה רוצה בחדר?',o:['שקט מוחלט','שיחה בשקט','אווירה חיה','הרבה רעש וצחוק']},
 {id:'temp',s:'טמפרטורה',t:'מה הטמפרטורה האידיאלית בחדר?',o:['קר מאוד, מזגן חזק','קריר','נעים','חם, בלי מזגן']},
 {id:'study',s:'לימוד בחדר',t:'כמה אתה לומד בחדר?',o:['הרוב בחדר','לפעמים','כמעט הכל בבית המדרש','אני כמעט לא בחדר']},
 {id:'guests',s:'אורחים',t:'כמה חברים מגיעים אליך לחדר?',o:['אף אחד','מדי פעם','הרבה','החדר שלי הוא המפגש']},
 {id:'food',s:'אוכל',t:'מה לגבי אוכל בחדר?',o:['לא אוכל בחדר','חטיף מדי פעם','מקרר ומגירת חטיפים','מטבח שלם']},
 {id:'night',s:'אחרי כיבוי אור',t:'מה אתה עושה אחרי כיבוי אור?',o:['ישן מיד','משפט או שניים','שיחה בלחש','שיחות עד מאוחר']},
 {id:'share',s:'שיתוף חפצים',t:'איך אתה עם שיתוף חפצים?',o:['הכל פרטי','מבקשים רשות','לוקחים ומחזירים','הכל משותף']}
];
var NQ=QS.length;
function fresh(){return {me:{a:{},w:{}},friends:[],picks:[],conflicts:[],view:'friends',active:null,qi:0,demoMe:false};}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.me&&o.friends)return Object.assign(fresh(),o,{active:null});}}catch(e){}
  return fresh();
}
var S=load(), ui={open:{},confirm:null,msg:'',lock:false,confirmReset:false,copied:false,showText:false,panel:null,xcopied:false,importText:'',importMsg:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function uid(){return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function friend(id){return S.friends.filter(function(f){return f.id===id;})[0];}
function cnt(n){return Object.keys(n.a).length;}
function nm(n){return n===S.me?'אתה':n.name;}
function ini(n){return n===S.me?'אני':esc(Array.from(n.name)[0]||'?');}

function compat(A,B){
  var num=0,den=0,n=0;
  QS.forEach(function(q){
    var x=A.a[q.id],y=B.a[q.id];
    if(x==null||y==null)return;
    var wt=S.me.w[q.id]?2:1;
    num+=wt*(1-Math.abs(x-y)/(q.o.length-1));den+=wt;n++;
  });
  return n?{pct:Math.round(num/den*100),n:n}:null;
}
function band(p){return p>=80?['קרוב מאוד','b4']:p>=65?['מתאים','b3']:p>=50?['בינוני','b2']:['רחוק','b1'];}
function groupStats(ids){
  var nodes=[S.me].concat(ids.map(friend).filter(Boolean)),sum=0,c=0,worst=null;
  for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
    var r=compat(nodes[i],nodes[j]);if(!r)continue;
    sum+=r.pct;c++;if(!worst||r.pct<worst.pct)worst={pct:r.pct,a:nodes[i],b:nodes[j]};
  }
  return {avg:c?Math.round(sum/c):null,worst:worst};
}

function norm(s){return String(s).trim().replace(/\s+/g,' ').toLowerCase();}
function exportText(){
  var ids=QS.map(function(q){return q.id;});
  var lines=['roommates-v1','#'+ids.join(',')];
  S.friends.forEach(function(f){
    if(f.demo||!cnt(f))return;
    lines.push(f.name.replace(/[|\r\n]/g,' ')+'|'+ids.map(function(id){return f.a[id]==null?'-':f.a[id];}).join(','));
  });
  return lines.join('\n');
}
function keyBytes(){return Array.from(new TextEncoder().encode('shutafim-lahedar-v1'));}
function scramble(arr){var k=keyBytes();return arr.map(function(x,i){return (x^k[i%k.length]^((i*13+5)&255))&255;});}
function sumOf(arr){var s=0;arr.forEach(function(x){s=(s+x*31+7)&0xffff;});return s;}
function exportCode(){
  var plain=Array.from(new TextEncoder().encode(exportText())),s=sumOf(plain);
  var out=scramble(plain);
  out.push(((s>>8)^0xA5)&255,((s&255)^0x5A)&255);
  var bin='';out.forEach(function(c){bin+=String.fromCharCode(c);});
  return 'RM1.'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeToken(tok){
  try{
    var s=tok.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
    var bin=atob(s),arr=[];for(var i=0;i<bin.length;i++)arr.push(bin.charCodeAt(i));
    if(arr.length<2)return null;
    var c=(((arr[arr.length-2]^0xA5)&255)<<8)|((arr[arr.length-1]^0x5A)&255);
    var plain=scramble(arr.slice(0,-2));
    if(sumOf(plain)!==c)return null;
    return new TextDecoder().decode(new Uint8Array(plain));
  }catch(e){return null;}
}
function readImport(raw){
  var t=String(raw).replace(/[‎‏‪-‮⁦-⁩]/g,'');
  var toks=t.match(/RM1\.[A-Za-z0-9_-]+/g);
  if(!toks)return {list:parseImport(t),bad:false};
  var texts=[],bad=false;
  toks.forEach(function(k){var d=decodeToken(k.slice(4));if(d==null)bad=true;else texts.push(d);});
  if(bad)return {list:null,bad:true};
  return {list:parseImport(texts.join('\n')),bad:false};
}
function parseImport(t){
  t=String(t).replace(/[‎‏‪-‮⁦-⁩]/g,'');
  var lines=t.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
  var hi=-1;for(var h=0;h<lines.length;h++){if(/^roommates-v1/i.test(lines[h])){hi=h;break;}}
  if(hi<0)return null;
  var ids=null,out=[];out.extra={me:{},w:{},picks:[],conf:[]};
  for(var i=hi+1;i<lines.length;i++){
    var l=lines[i];
    if(l.charAt(0)==='#'){ids=l.slice(1).split(',').map(function(x){return x.trim();});continue;}
    if(!ids)continue;
    if(l.charAt(0)==='@'){
      var ps=l.slice(1).split('|'),tag=ps[0].trim();
      if(tag==='me'){
        var mv=(ps[1]||'').split(',').map(function(x){return x.trim();});
        ids.forEach(function(id,j){
          var q2=QS.filter(function(x){return x.id===id;})[0];
          if(!q2||mv[j]==null||mv[j]===''||mv[j]==='-')return;
          var n2=parseInt(mv[j],10);
          if(!isNaN(n2)&&n2>=0&&n2<q2.o.length)out.extra.me[id]=n2;
        });
      }else if(tag==='w'){
        (ps[1]||'').split(',').forEach(function(x){x=x.trim();if(x)out.extra.w[x]=true;});
      }else if(tag==='pick'){
        out.extra.picks=out.extra.picks.concat(ps.slice(1).map(function(x){return x.trim();}).filter(Boolean));
      }else if(tag==='conf'&&ps[1]&&ps[2]){
        out.extra.conf.push({name:ps[1].trim(),qid:ps[2].trim(),alts:(ps[3]||'').split(',').map(function(x){return parseInt(x,10);}).filter(function(n){return !isNaN(n);})});
      }
      continue;
    }
    var k=l.lastIndexOf('|');if(k<1)continue;
    var name=l.slice(0,k).trim(),vals=l.slice(k+1).split(',').map(function(x){return x.trim();}),a={};
    ids.forEach(function(id,j){
      var q=QS.filter(function(x){return x.id===id;})[0];
      if(!q||vals[j]==null||vals[j]===''||vals[j]==='-')return;
      var n=parseInt(vals[j],10);
      if(!isNaN(n)&&n>=0&&n<q.o.length)a[id]=n;
    });
    if(name)out.push({name:name,a:a});
  }
  return out;
}
function mergeIn(list){
  var r={added:0,filled:0,same:0,conf:0};
  list.forEach(function(it){
    var key=norm(it.name),f=S.friends.filter(function(x){return norm(x.name)===key;})[0];
    if(!f){f={id:uid(),name:it.name,a:{}};S.friends.push(f);r.added++;}
    Object.keys(it.a).forEach(function(id){
      var v=it.a[id],cur=f.a[id];
      if(cur==null){f.a[id]=v;r.filled++;return;}
      if(cur===v){r.same++;return;}
      var c=S.conflicts.filter(function(x){return x.fid===f.id&&x.qid===id;})[0];
      if(!c){c={fid:f.id,qid:id,alts:[cur]};S.conflicts.push(c);r.conf++;}
      if(c.alts.indexOf(v)<0)c.alts.push(v);
    });
  });
  return r;
}
function hasEx(l){
  var e=l&&l.extra;
  return !!(e&&(Object.keys(e.me).length||Object.keys(e.w).length||e.picks.length||e.conf.length));
}
function byName(n){var k=norm(n);return S.friends.filter(function(x){return norm(x.name)===k;})[0];}
function applyExtra(e,r){
  r.me=0;r.picks=0;
  if(!e)return;
  Object.keys(e.me).forEach(function(id){if(S.me.a[id]==null){S.me.a[id]=e.me[id];r.me++;}});
  Object.keys(e.w).forEach(function(id){if(!S.me.w[id])S.me.w[id]=true;});
  e.picks.forEach(function(n){
    var f=byName(n);
    if(f&&S.picks.indexOf(f.id)<0&&S.picks.length<MAXP){S.picks.push(f.id);r.picks++;}
  });
  e.conf.forEach(function(c){
    var f=byName(c.name);if(!f)return;
    var cur=f.a[c.qid];if(cur==null)return;
    var cf=S.conflicts.filter(function(x){return x.fid===f.id&&x.qid===c.qid;})[0];
    c.alts.forEach(function(v){
      if(v===cur)return;
      if(!cf){cf={fid:f.id,qid:c.qid,alts:[cur]};S.conflicts.push(cf);r.conf++;}
      if(cf.alts.indexOf(v)<0)cf.alts.push(v);
    });
  });
}
function confCount(){return S.conflicts.filter(function(c){return !!friend(c.fid);}).length;}
function banner(){

      }).join('')+'</div><div style="margin-top:6px"><button class="link" data-act="keep" data-f="'+f.id+'" data-q="'+q.id+'">השאר את השמורה ולא לשאול שוב</button></div></div>';

function ioView(){
  var h='<div class="tool"><button class="btn small ghost" data-act="panel" data-id="export" aria-expanded="'+(ui.panel==='export')+'">ייצוא תשובות</button><button class="btn small ghost" data-act="panel" data-id="import" aria-expanded="'+(ui.panel==='import')+'">ייבוא תשובות</button></div>';

    else{
      var t=exportCode();

function header(){

}

function meView(){
  var h='<p class="muted" style="margin:0 0 12px">ענה על אותן שאלות בשבילך. סמן "חשוב לי" על מה שחשוב לך במיוחד, והוא ישפיע פי שניים על הדירוג.</p><div class="stack">';
  QS.forEach(function(q){
    var cur=S.me.a[q.id],w=!!S.me.w[q.id];
    h+='<div class="card qcard"><div class="qhead"><div><p class="eyebrow">'+q.s+'</p><p class="qs">'+q.t+'</p></div><button class="star" data-act="mew" data-q="'+q.id+'" aria-pressed="'+w+'">חשוב לי</button></div><div class="opts grid">'
      +q.o.map(function(o,i){return '<button class="opt" data-act="mea" data-q="'+q.id+'" data-i="'+i+'" aria-pressed="'+(cur===i)+'"><span class="r"></span><span>'+o+'</span></button>';}).join('')+'</div></div>';
  });
  return h+'</div>';
}

function detail(f){
  var h='<div class="det"><span class="h"></span><span class="h">אתה</span><span class="h">'+esc(f.name)+'</span><span></span>';

    h+='<span class="muted">'+q.s+'</span><span>'+(x!=null?q.o[x]:'-')+'</span><span>'+(y!=null?q.o[y]:'לא נשאל')+'</span>'+dot;
  });

function listText(){
  var ps=S.picks.map(friend).filter(Boolean);

function tray(){
  var slots='';
  for(var i=0;i<MAXP;i++){
    var f=friend(S.picks[i]);
    slots+=f?'<div class="bed f" title="'+esc(f.name)+'">'+ini(f)+'</div>':'<div class="bed"></div>';
  }
  var st=groupStats(S.picks),txt;
  if(ui.msg)txt='<span class="msg">'+ui.msg+'</span>';
  else if(!S.picks.length)txt='בחר עד '+MAXP+' חברים לרשימה למדריך. אפשר גם פחות.';
  else txt='ברשימה <b class="num">'+S.picks.length+'</b> מתוך <span class="num">'+MAXP+'</span>'+(S.picks.length<MAXP?'. אפשר להוסיף, או לשלוח כך.':'');
  var sub='';
  if(st.avg!=null&&S.picks.length>=1)sub='<span class="sub">התאמה ממוצעת בין כולם: <b class="num" dir="ltr">'+st.avg+'%</b>'+(st.worst&&S.picks.length>=2?' · הכי פחות מתאימים: '+esc(nm(st.worst.a))+' ו'+esc(nm(st.worst.b))+' (<span class="num" dir="ltr">'+st.worst.pct+'%</span>)':'')+'</span>';
  var cp='';
  if(S.picks.length){
    cp='<div class="copyrow"><button class="btn small" data-act="copy">'+(ui.copied?'הועתק':'העתק רשימה למדריך')+'</button></div>';
    if(ui.showText)cp+='<textarea id="ctext" class="ctext" readonly rows="'+(S.picks.length+2)+'">'+esc(listText())+'</textarea>';
  }
  return '<div class="tray"><div class="beds">'+slots+'</div><p class="ttxt">'+txt+sub+'</p>'+cp+'</div>';
}

function resultsView(){
  if(cnt(S.me)<3){
    return '<div class="card empty">כדי לדרג חברים צריך קודם לענות על השאלות בעצמך (לפחות 3).<br><br><button class="btn" data-act="tab" data-id="me">לשאלות שלי</button></div>';
  }
  var ranked=[],pending=[];
  S.friends.forEach(function(f){var c=compat(S.me,f);if(c)ranked.push({f:f,c:c});else pending.push(f);});
  ranked.sort(function(a,b){return b.c.pct-a.c.pct||a.f.name.localeCompare(b.f.name,'he');});
  if(!S.friends.length){
    return '<div class="card empty">עוד אין חברים לדרג. הוסף חברים ושאל אותם את השאלות.<br><br><button class="btn" data-act="tab" data-id="friends">לרשימת החברים</button></div>'+tray();
  }
  var full=S.picks.length>=MAXP;
  var h='<div class="stack">'+ranked.map(function(x,i){
    var f=x.f,p=x.c.pct,b=band(p),picked=S.picks.indexOf(f.id)>=0,open=!!ui.open[f.id];
    var part=cnt(f)<NQ?'<span class="muted" style="font-size:12px"> · ענה על '+cnt(f)+' מתוך '+NQ+'</span>':'';
    return '<div class="card row"><div class="rtop"><div class="rank num">'+(i+1)+'</div><div class="fmain"><div class="fname">'+esc(f.name)+(f.demo?'<span class="tag">דוגמה</span>':'')+'</div><span class="pill '+b[1]+'">'+b[0]+'</span>'+part+'</div><div class="pct num '+b[1]+'" dir="ltr">'+p+'%</div></div>'
      +'<div class="bar '+b[1]+'"><i style="width:'+p+'%"></i></div>'
      +'<div class="acts"><button class="btn small pick" data-act="pick" data-id="'+f.id+'" aria-pressed="'+picked+'"'+(!picked&&full?' aria-disabled="true"':'')+'>'+(picked?'ברשימה':'הוסף לרשימה')+'</button><button class="link" data-act="open" data-id="'+f.id+'">'+(open?'הסתר פירוט':'פירוט')+'</button></div>'
      +(open?detail(f):'')+'</div>';
  }).join('')+'</div>';
  if(pending.length){
    h+='<p class="sec">עוד לא נשאלו</p><div class="stack">'+pending.map(function(f){
      return '<div class="card friend"><div class="av">'+ini(f)+'</div><div class="fmain fname">'+esc(f.name)+'</div><button class="btn small ghost" data-act="ask" data-id="'+f.id+'">שאל</button></div>';
    }).join('')+'</div>';
  }
  return h+tray();
}

function render(keepFocus){
  var h=header()+tabs()+banner();
  if(S.view==='friends')h+=S.active?interview():friendsView();
  else if(S.view==='me')h+=meView();
  else if(S.view==='conflicts')h+=conflictsView();
  else h+=resultsView();
  var app=document.getElementById('app');
  app.innerHTML=h;
}
function top(){try{window.scrollTo(0,0);}catch(e){}}

function demo(){
  var names=['אורי','יונתן','נועם','דביר','אלחנן','שמעון','איתן'];
  names.forEach(function(n,k){
    var a={};
    QS.forEach(function(q,i){if(k===6&&i>3)return;a[q.id]=Math.floor(Math.random()*q.o.length);});
    S.friends.push({id:uid(),name:n,a:a,demo:true});
  });
  if(!cnt(S.me)){QS.forEach(function(q){S.me.a[q.id]=Math.floor(Math.random()*q.o.length);});S.demoMe=true;}
  save();
}
function clearDemo(){
  S.friends=S.friends.filter(function(f){return !f.demo;});
  S.picks=S.picks.filter(function(id){return !!friend(id);});
  S.conflicts=S.conflicts.filter(function(c){return !!friend(c.fid);});
  if(S.demoMe){S.me={a:{},w:{}};S.demoMe=false;}
  save();
}

document.getElementById('app').addEventListener('submit',function(e){
  if(e.target.id!=='addf')return;
  e.preventDefault();
  var inp=document.getElementById('nm'),v=inp.value.trim();
  if(!v){inp.focus();return;}
  S.friends.push({id:uid(),name:v,a:{}});
  save();render();
  var n=document.getElementById('nm');if(n)n.focus();
});

document.getElementById('app').addEventListener('input',function(e){
  if(e.target.id==='itext')ui.importText=e.target.value;
});

document.getElementById('app').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var act=b.dataset.act,id=b.dataset.id,i=b.dataset.i!=null?+b.dataset.i:null,q=b.dataset.q;
  ui.msg='';
  if(act!=='del')ui.confirm=null;
  if(act!=='reset')ui.confirmReset=false;
  if(act==='tab'){S.view=id;S.active=null;save();render();top();return;}
  if(act==='ask'){
    var f=friend(id);S.view='friends';S.active=id;
    var k=0;for(;k<NQ;k++){if(f.a[QS[k].id]==null)break;}
    S.qi=k>=NQ?0:k;render();top();return;
  }
  if(act==='close'){S.active=null;render();top();return;}
  if(act==='jump'){S.qi=i;render();return;}
  if(act==='prev'){if(S.qi>0)S.qi--;render();return;}
  if(act==='next'){if(S.qi<NQ-1)S.qi++;render();return;}
  if(act==='ans'){
    var fr=friend(S.active);if(!fr||ui.lock)return;
    fr.a[QS[S.qi].id]=i;S.conflicts=S.conflicts.filter(function(c){return !(c.fid===fr.id&&c.qid===QS[S.qi].id);});save();render();
    var at=S.qi,aid=S.active;ui.lock=true;
    setTimeout(function(){
      ui.lock=false;
      if(S.active!==aid||S.qi!==at)return;
      if(S.qi<NQ-1){S.qi++;}else{S.active=null;top();}
      render();
    },240);
    return;
  }
  if(act==='del'){
    if(ui.confirm===id){
      S.friends=S.friends.filter(function(x){return x.id!==id;});
      S.conflicts=S.conflicts.filter(function(c){return c.fid!==id;});
      S.picks=S.picks.filter(function(x){return x!==id;});
      ui.confirm=null;save();
    }else{
      ui.confirm=id;
      setTimeout(function(){if(ui.confirm===id){ui.confirm=null;render();}},3500);
    }
    render();return;
  }
  if(act==='mea'){
    if(S.me.a[q]===i)delete S.me.a[q];else S.me.a[q]=i;
    S.demoMe=false;save();render();return;
  }
  if(act==='mew'){
    if(S.me.w[q])delete S.me.w[q];else S.me.w[q]=true;
    save();render();return;
  }
  if(act==='pick'){
    var at2=S.picks.indexOf(id);
    if(at2>=0)S.picks.splice(at2,1);
    else if(S.picks.length>=MAXP)ui.msg='כבר בחרת '+MAXP+'. הסר מישהו כדי להחליף.';
    else S.picks.push(id);
    save();render();return;
  }
  if(act==='copy'){
    var txt=listText();
    var ok=function(){ui.copied=true;ui.showText=false;render();setTimeout(function(){ui.copied=false;render();},2000);};
    var fail=function(){ui.showText=true;render();var t=document.getElementById('ctext');if(t){t.focus();t.select();}};
    try{navigator.clipboard.writeText(txt).then(ok,fail);}catch(err){fail();}
    return;
  }
  if(act==='open'){ui.open[id]=!ui.open[id];render();return;}
  if(act==='conf'){S.view='conflicts';S.active=null;save();render();top();return;}
  if(act==='resolve'||act==='keep'){
    var cf=friend(b.dataset.f);
    if(cf&&act==='resolve')cf.a[q]=i;
    S.conflicts=S.conflicts.filter(function(c){return !(c.fid===b.dataset.f&&c.qid===q);});
    save();render();return;
  }
  if(act==='panel'){ui.panel=ui.panel===id?null:id;ui.importMsg=null;ui.xcopied=false;render();return;}
  if(act==='xcopy'){
    var xt=exportCode();
    var xok=function(){ui.xcopied=true;render();setTimeout(function(){ui.xcopied=false;render();},2000);};
    var xfail=function(){var t=document.getElementById('xtext');if(t){t.focus();t.select();}};
    try{navigator.clipboard.writeText(xt).then(xok,xfail);}catch(err2){xfail();}
    return;
  }
  if(act==='doimport'){
    var rd=readImport(ui.importText||''),list=rd.list;
    if(!list||(!list.length&&!hasEx(list))){
      ui.importMsg={ok:false,t:rd.bad?'הקוד פגום או נחתך. העתק אותו שוב במלואו.':list?'לא נמצאו חברים עם תשובות בקוד.':'הקוד לא מזוהה. ודא שהעתקת את כולו.'};
      render();return;
    }
    var r=mergeIn(list);applyExtra(list.extra,r);var parts=[];
    if(r.added)parts.push('נוספו '+r.added+' חברים');
    if(r.filled)parts.push('הושלמו '+r.filled+' תשובות');
    if(r.me)parts.push('הושלמו '+r.me+' תשובות שלך');
    if(r.picks)parts.push('נוספו '+r.picks+' חברים לרשימה למדריך');
    if(r.conf)parts.push(r.conf+' תשובות סותרות מחכות להכרעה');
    ui.importMsg={ok:true,t:'הייבוא הסתיים. '+(parts.length?parts.join(' · ')+'.':'הכל כבר היה קיים, אין מה לעדכן.')};
    ui.importText='';save();render();return;
  }
  if(act==='demo'){demo();render();return;}
  if(act==='cleardemo'){clearDemo();render();return;}
  if(act==='reset'){
    if(ui.confirmReset){S=fresh();ui.confirmReset=false;ui.open={};save();}
    else{ui.confirmReset=true;setTimeout(function(){if(ui.confirmReset){ui.confirmReset=false;render();}},3500);}
    render();return;
  }
});
render();
})();
</script>
</body>
</html>
