<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1d1b16">
  <title>ניהול - תורנויות חדר</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Secular+One&display=swap">
  <link rel="stylesheet" href="../style.css?v=2">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("ch-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
  </script>
</head>
<body class="admin">
  <div id="boot" class="loader"><div class="spin"></div></div>

  <section id="login" class="login hidden">
    <div class="login-card">
      <div class="logo">ת</div>
      <h1>ניהול תורנויות חדר</h1>
      <p>כניסה עם חשבון ה-Google של המנהל</p>
      <button id="loginBtn" class="gbtn"></button>
      <div id="loginErr" class="err"></div>
    </div>
  </section>

  <div id="app" class="hidden">
    <header class="hdr">
      <div class="hdr-in">
        <div class="brand"><div class="dot">ת</div><div class="grow"><b>ניהול תורנויות חדר</b><span id="hdrSub"></span></div></div>
        <a class="icon-btn" href="../" title="לאתר" style="text-decoration:none"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></a>
        <button class="icon-btn" id="themeBtn" title="מצב כהה/בהיר"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16z" fill="currentColor"/></svg></button>
        <button class="icon-btn" id="logoutBtn" title="התנתקות"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
  </div>

  <script type="module" src="admin.js?v=2"></script>
</body>
</html>
