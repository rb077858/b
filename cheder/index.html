<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1d1b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="תורנויות">
  <title>תורנויות חדר</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Secular+One&display=swap">
  <link rel="stylesheet" href="style.css?v=12">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("ch-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) {}
  </script>
</head>
<body>
  <div id="boot" class="loader"><div class="spin"></div></div>

  <section id="login" class="login hidden">
    <div class="login-card">
      <div class="logo">ת</div>
      <h1>תורנויות חדר</h1>
      <p id="loginText">הסידור היומי של החדר: מיטות, שולחן, טאטוא, תורנות קומה ומטבחון</p>
      <div id="joinBox" class="hidden"></div>
      <button id="loginBtn" class="gbtn"></button>
      <button id="logoutBtn2" class="btn block hidden" style="margin-top:10px">התחברות עם חשבון אחר</button>
      <div id="loginErr" class="err"></div>
    </div>
  </section>

  <div id="app" class="hidden">
    <header class="hdr">
      <div class="hdr-in">
        <div class="brand"><div class="dot" id="roomDot"></div><div class="grow"><b>תורנויות חדר</b><span id="hdrSub"></span></div></div>
        <button class="icon-btn" id="themeBtn" title="מצב כהה/בהיר"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16a8 8 0 0 0 0-16z" fill="currentColor"/></svg></button>
        <button class="icon-btn" id="meBtn" title="החשבון שלי"></button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
  </div>

  <script type="module" src="app.js?v=12"></script>
</body>
</html>
