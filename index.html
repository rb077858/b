<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>מעביר אותך...</title>
</head>
<body>
    <div id="msg" style="text-align:center; margin-top:50px; font-family:sans-serif;">
        מנסה להפנות אותך ליעד...
    </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // אותו Config בדיוק
 const firebaseConfig = {
  apiKey: "AIzaSyC_I0SPhZfC3qOfsJ6ZhURN_3QEwmYGU6Y",
  authDomain: "reem-shortener.firebaseapp.com",
  projectId: "reem-shortener",
  storageBucket: "reem-shortener.firebasestorage.app",
  messagingSenderId: "1098344042999",
  appId: "1:1098344042999:web:c823e438cd424802195ef2"
};


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function performRedirect() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
        document.getElementById('msg').innerText = "שגיאה: לא סופק מזהה קישור.";
        return;
    }

    try {
        const docRef = doc(db, "links", id);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            window.location.replace(data.originalUrl);
        } else {
            document.getElementById('msg').innerText = "הקישור אינו קיים במערכת.";
        }
    } catch (e) {
        document.getElementById('msg').innerText = "שגיאה בחיבור למסד הנתונים.";
        console.error(e);
    }
  }

  performRedirect();
</script>
</body>
</html>
